version: "3.8"

services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "8000:80"
    volumes:
      - ./_docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/test_catalog
    container_name: nginx
    networks:
      - app_network
  php:
    build:
      context: .
      dockerfile: _docker/php/php.Dockerfile
    volumes:
      - ./:/var/www/test_catalog
    depends_on:
      - mysql
    container_name: php
    networks:
      - app_network
  mysql:
    image: mysql:8.0
    ports:
      - "3316:3306"
    env_file:
      - _docker/mysql/mysql.env
    container_name: mysql_2
    networks:
      - app_network
networks:
  app_network:
    driver: bridge
