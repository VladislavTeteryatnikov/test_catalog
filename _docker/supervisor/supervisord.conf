[supervisord]
nodaemon=true
logfile=/dev/null

[program:php-fpm]
command=docker-php-entrypoint php-fpm
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/null


[program:queue]
command=php /var/www/test_catalog/artisan queue:work --tries=3 --timeout=90
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/null

[program:scheduler]
command=php /var/www/test_catalog/artisan schedule:work
autostart=true
autorestart=true
stderr_logfile=/dev/null
stdout_logfile=/dev/null
